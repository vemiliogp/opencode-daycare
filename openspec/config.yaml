schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  OpenDayCare: web app for managing a daycare (guardería), UI in Spanish.
  Parents view a feed of their children's daily activity (meals, naps, notes) and receive notifications.
  Staff/daycare manage children, log daily events and communicate with families.
  Multi-tenant: data is isolated per family and per daycare.
  Tech stack: Next.js 16 (App Router), React 19, TypeScript strict, Tailwind CSS v4, Supabase (Postgres, Auth, RLS, Storage).
  Conventions: code (names, functions, variables) in English, UI text in Spanish; DB changes only via Supabase migrations.
